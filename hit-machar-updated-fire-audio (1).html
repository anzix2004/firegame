<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hit Machar</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--outer:#fff;--ink:#111;--muted:#555;--yellow:#fad744;--yellow-d:#cfa813;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outer:#16161a}}
:root[data-theme="dark"]{--outer:#16161a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--outer);font-family:'Comic Sans MS','Comic Neue',cursive;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:min(100%,540px);height:100%;margin:0 auto;background:#fff;overflow:hidden;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:5}
.hide{display:none!important}
/* menu */
.hero{position:relative;width:300px;height:250px}
.hero svg{position:absolute;left:30px;top:0;width:150px;height:250px;overflow:visible}
.bubble{position:absolute;left:170px;top:20px;width:112px;padding:10px 6px;background:#fff;border:3px solid #111;border-radius:14px;box-shadow:4px 4px 0 var(--yellow);font:italic 18px/1.05 'Bangers','Comic Sans MS',cursive;letter-spacing:.5px;text-align:center;text-transform:uppercase;transform:rotate(2deg)}
.bubble:before{content:"";position:absolute;left:-12px;top:44px;border:8px solid transparent;border-right:12px solid #111}
.bubble:after{content:"";position:absolute;left:-7px;top:46px;border:6px solid transparent;border-right:9px solid #fff}
h1{margin:6px 0 0;font-size:clamp(44px,13vw,68px);font-weight:700;letter-spacing:2px;text-shadow:4px 4px 0 var(--yellow);-webkit-text-stroke:1.5px #111;color:#111;line-height:1}
.sub{margin:10px 0 14px;color:#555;letter-spacing:.3em;font-size:14px}
.btn{font:700 24px 'Comic Sans MS','Comic Neue',cursive;border:0;cursor:pointer;color:#111;background:var(--yellow);padding:12px 36px;border-radius:40px;box-shadow:0 6px 0 var(--yellow-d),0 12px 18px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yellow-d)}
.btn.dark{background:#161616;color:#fff;box-shadow:0 6px 0 #000,0 12px 18px rgba(0,0,0,.3);font-size:19px;padding:10px 26px}
.how{margin-top:22px;width:min(88%,380px);padding:14px 18px;border:2px dashed #8a8aa0;border-radius:20px;text-align:center;font-size:15.5px;line-height:1.7;color:#333}
.how b{font-weight:700;color:#000}
.face{margin-top:10px;font:400 12px 'Comic Sans MS','Comic Neue',cursive;color:#777;background:none;border:0;text-decoration:underline;cursor:pointer}
/* game */
#hud{position:absolute;top:10px;left:0;right:0;text-align:center;pointer-events:none;z-index:2}
#score{font-size:46px;font-weight:700;line-height:1}
#hud small{display:block;margin-top:2px;font-size:14px;font-weight:700;color:#444;letter-spacing:.05em}
#pause{position:absolute;top:14px;right:14px;z-index:6;width:62px;height:62px;border:0;border-radius:16px;background:#26324a;box-shadow:0 5px 0 #121a2c,0 10px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#pause i{width:7px;height:24px;background:#fff;border-radius:2px}
#pause:active{transform:translateY(4px);box-shadow:0 1px 0 #121a2c}
#hint{position:absolute;left:0;right:0;top:51%;text-align:center;font-weight:700;font-size:18px;transition:opacity .5s;pointer-events:none}
#hint.off{opacity:0}
#bed{position:absolute;left:3%;bottom:5%;width:94%;height:auto;max-height:62%;object-fit:contain;pointer-events:none;transform-origin:63% 54%;transition:transform .16s,filter .12s}
#bed.aim{transform:rotate(-1deg) scale(1.005)}
#bed.fire{transform:rotate(-2deg) scale(1.015);filter:brightness(1.08)}
#bed.laugh{animation:bedLaugh .14s ease-in-out 5}
@keyframes bedLaugh{50%{transform:rotate(1deg) translateY(-3px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pausescr{background:rgba(32,33,36,.92);color:#fff;z-index:8;gap:14px}
#pausescr h2{margin:0 0 6px;font-size:40px;color:var(--yellow);text-shadow:0 0 14px rgba(250,215,68,.55)}
#pausescr .btn.dark{border:1px solid #333}
#gameoverscr{background:rgba(20,24,35,.94);color:#fff;z-index:10;gap:14px}
#gameoverscr h2{margin:0;color:#ff5b62;font-size:clamp(42px,12vw,60px);text-shadow:3px 3px 0 #7d1720}
#gameoverscr p{margin:0 0 8px;font-size:20px}
#finalscore{color:var(--yellow);font-weight:700;font-size:30px}
.z{font:700 20px 'Comic Sans MS',cursive;opacity:0;animation:zz 2.6s infinite}
.z:nth-of-type(2){animation-delay:.9s}.z:nth-of-type(3){animation-delay:1.8s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}
@media (prefers-reduced-motion:reduce){.z{animation:none;opacity:.6}}
#mhead{transform-box:view-box;transform-origin:75px 68px;transition:transform .35s}
.hero.p2 #mhead{transform:rotate(-5deg)}.hero.p3 #mhead{transform:rotate(6deg)}.hero.p4 #mhead{transform:rotate(-9deg) translateY(-2px)}
.hero svg{animation:bob 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.talk{transform-box:fill-box;transform-origin:center;animation:tk .3s ease-in-out infinite alternate}
@keyframes tk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
#head{transform-box:view-box;transform-origin:126px 114px;transform:rotate(var(--t,0deg));transition:transform .2s}












@media (prefers-reduced-motion:reduce){.hero svg{animation:none} #bed.laugh{animation:none}}

#head .bed-character{display:inline}
#head>circle,#head>.ec,#head>.eo,#head>.ms,#head>.mt{display:none!important}
</style>
</head>

    if(playback&&typeof playback.catch==='function')playback.catch(()=>{});
  },
  kill(){ if(!A)return; const t=A.currentTime;
    noise(t,.12,.45,900); tone('triangle',400,90,t,.18,.35);
    tone('square',880,1320,t+.06,.12,.12);
  },
  click(){if(!A)return;tone('square',500,760,A.currentTime,.07,.08)}
};
function updateBuzz(){
  if(!buzz||!A)return;
  let best=0,sp=0;
  if(mode==='play') for(const m of M){const d=Math.hypot(m.x-O.x,m.y-O.y);const v=Math.max(0,1-d/(H*.9));if(v>best){best=v;sp=Math.hypot(m.vx,m.vy)}}
  const t=A.currentTime,f=240+sp*1.4+Math.sin(t*3)*18;
  buzz.g.gain.setTargetAtTime(M.length&&mode==='play'?.05+best*.2:0,t,.12);
  buzz.o1.frequency.setTargetAtTime(f,t,.05); buzz.o2.frequency.setTargetAtTime(f*2.03,t,.05);
}

/* ---------- layout ---------- */
function resize(){
  const r=stage.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height; cv.width=W*dpr; cv.height=H*dpr; c.setTransform(dpr,0,0,dpr,0,0);
  const b=$('#bed').getBoundingClientRect();
  O.x=b.left-r.left+b.width*.63-115; O.y=b.top-r.top+b.height*.54-40;
}
addEventListener('resize',resize);
$('#bed').addEventListener('load',resize);

/* ---------- menu ---------- */
const lines=["Machar bhagao, neend aane do!","Aaj ek bhi nahi bachna chahiye!","Raat ki neend pe hamla? Bilkul nahi!"];
let li=0,pi=0; const hero=$('#hero');
setInterval(()=>{ if(mode!=='menu')return; pi=(pi+1)%4; hero.className='hero p'+(pi+1); setPose(pi); li=(li+1)%lines.length; $('#bubble').textContent=lines[li]; },1700);

/* ---------- menu hero arms: smooth jointed animation ---------- */
const SH=[75,92];
const POSES=[
  {L:[57,123,58,148],R:[93,123,92,148]},
  {L:[46,112,50,86], R:[93,123,92,148]},
  {L:[46,112,28,98], R:[98,112,82,124]},
  {L:[44,84,40,56],  R:[93,123,92,148]}
];
const armL=$('#armL'),armR=$('#armR'),handL=$('#handL'),handR=$('#handR'),hL=[0,1,2,3].map(i=>$('#hL'+i));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=POSES[0].L.concat(POSES[0].R), tgt=cur.slice(), cw=[1,0,0,0], tw=[1,0,0,0], armRun=false, armLast=0;
function wob(e,w,a){const dx=w[0]-e[0],dy=w[1]-e[1],c=Math.cos(a),s=Math.sin(a);return[e[0]+dx*c-dy*s,e[1]+dx*s+dy*c]}
function drawArms(t){
  const a=cw[1]*.16*Math.sin(t*17)+cw[2]*.2*Math.sin(t*6)+cw[3]*.05*Math.sin(t*5);
  const lw=wob([cur[0],cur[1]],[cur[2],cur[3]],a), rw=[cur[6],cur[7]];
  armL.setAttribute('d',`M${SH[0]} ${SH[1]}L${cur[0]} ${cur[1]}L${lw[0]} ${lw[1]}`);
  armR.setAttribute('d',`M${SH[0]} ${SH[1]}L${cur[4]} ${cur[5]}L${rw[0]} ${rw[1]}`);
  const ang=(e,w)=>Math.atan2(w[0]-e[0],-(w[1]-e[1]))*180/Math.PI;
  handL.setAttribute('transform',`translate(${lw[0]} ${lw[1]}) rotate(${ang([cur[0],cur[1]],lw)}) scale(1.3)`);
  handR.setAttribute('transform',`translate(${rw[0]} ${rw[1]}) rotate(${ang([cur[4],cur[5]],rw)}) scale(1.3)`);
  hL.forEach((g,i)=>g.setAttribute('opacity',cw[i].toFixed(3)));
}
function armLoop(now){
  const dt=Math.min(.05,(now-armLast)/1000)||.016; armLast=now;
  const k=reduce?1:1-Math.exp(-dt*9);
  for(let i=0;i<8;i++)cur[i]+=(tgt[i]-cur[i])*k;
  for(let i=0;i<4;i++)cw[i]+=(tw[i]-cw[i])*k;
  drawArms(reduce?0:now/1000);
  if(mode==='menu')requestAnimationFrame(armLoop); else armRun=false;
}
function armKick(){ if(!armRun){armRun=true;armLast=performance.now();requestAnimationFrame(armLoop)} }
function setPose(i){ tgt=POSES[i].L.concat(POSES[i].R); tw=[0,0,0,0]; tw[i]=1; }
drawArms(0); armKick();
$('#facebtn').onclick=()=>$('#facefile').click();
$('#facefile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{document.querySelectorAll('.faceimg').forEach(i=>{i.setAttribute('href',r.result);i.classList.remove('hide')})};
  r.readAsDataURL(f);
};

/* ---------- flow ---------- */
function show(id,on){$(id).classList.toggle('hide',!on)}
function start(){
  audio(); if(A&&A.state==='suspended')A.resume(); sfx.click();
  show('#menu',false);show('#game',true);show('#pausescr',false);show('#gameoverscr',false);
  kills=0;$('#score').textContent=0;M=[];beams=[];rings=[];parts=[];pops=[];shot=false;aiming=false;bedEl.classList.remove('aim','fire','laugh');
  $('#hint').classList.remove('off'); mode='play'; resize(); spawnIn=.6; last=performance.now(); requestAnimationFrame(loop);
}
function gameOver(){ if(mode!=='play')return; mode='gameover'; aiming=false; bedEl.classList.remove('aim','fire','laugh'); $('#finalscore').textContent=kills; show('#gameoverscr',true); updateBuzz(); }
function pause(){ if(mode!=='play')return; mode='pause'; aiming=false; bedEl.classList.remove('aim','fire','laugh'); show('#pausescr',true); sfx.click(); }
function resume(){ mode='play'; show('#pausescr',false); sfx.click(); last=performance.now(); requestAnimationFrame(loop); }
function toMenu(){ mode='menu'; armKick(); show('#pausescr',false);show('#game',false);show('#menu',true); sfx.click(); updateBuzz(); }
$('#play').onclick=start; $('#pause').onclick=e=>{e.stopPropagation();pause()};
$('#resume').onclick=resume; $('#tomenu').onclick=toMenu; $('#restart').onclick=start; $('#gameovermenu').onclick=toMenu;

/* ---------- input: hold = aim, release = fire ---------- */
const bedEl=$('#bed'); let rt,lt;
function tilt(){bedEl.style.setProperty('--t',Math.max(-8,Math.min(8,(ptr.x-O.x)/W*18))+'deg')}
function react(kill){bedEl.classList.add('fire');clearTimeout(rt);rt=setTimeout(()=>{bedEl.classList.remove('fire');if(kill){bedEl.classList.add('laugh');clearTimeout(lt);lt=setTimeout(()=>bedEl.classList.remove('laugh'),800)}},380)}
function pos(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
stage.addEventListener('pointerdown',e=>{
  if(mode!=='play'||e.target.closest('#pause'))return;
  aiming=true; ptr=pos(e); $('#hint').classList.add('off'); bedEl.classList.add('aim'); tilt(); sfx.tick(); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{ if(aiming){ptr=pos(e);tilt()} });
const rel=e=>{ if(!aiming||mode!=='play')return; aiming=false; bedEl.classList.remove('aim'); ptr=pos(e); fire(); };
stage.addEventListener('pointerup',rel);
stage.addEventListener('pointercancel',()=>{aiming=false;bedEl.classList.remove('aim')});

function fire(){
  let dx=ptr.x-O.x,dy=ptr.y-O.y,len=Math.hypot(dx,dy)||1; dx/=len;dy/=len;
  let hit=null,hd=1e9;
  for(const m of M){
    const px=m.x-O.x,py=m.y-O.y,t=px*dx+py*dy;
    if(t>0&&Math.abs(px*dy-py*dx)<m.r+8&&t<hd){hit=m;hd=t}
  }
  const end=hit?{x:O.x+dx*hd,y:O.y+dy*hd}:{x:O.x+dx*2500,y:O.y+dy*2500};
  beams.push({x1:O.x,y1:O.y,x2:end.x,y2:end.y,life:.22});
  sfx.fire(); react(!!hit);
  if(hit){
    for(const m of M){const px=m.x-O.x,py=m.y-O.y,t=px*dx+py*dy; if(t>0&&Math.abs(px*dy-py*dx)<m.r+8)kill(m)}
    M=M.filter(m=>!m.dead); setTimeout(sfx.kill,70);
  }
}
function kill(m){
  m.dead=true; kills++; $('#score').textContent=kills;
  // Layered blue ripples create a water-impact shockwave.
  rings.push({x:m.x,y:m.y,life:.42,max:.42,radius:12,width:6});
  rings.push({x:m.x,y:m.y,life:.62,max:.62,radius:7,width:4});
  rings.push({x:m.x,y:m.y,life:.78,max:.78,radius:3,width:2});
  // Water droplets burst outward, then fall back under gravity.
  const cols=['#00bfff','#36d9ff','#80eaff','#d8fbff','#168bd4','#ffffff'];
  for(let i=0;i<34;i++){
    const a=Math.random()*Math.PI*2;
    const speed=75+Math.random()*230;
    const size=2.2+Math.random()*5.5;
    parts.push({x:m.x,y:m.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-75,
      r:size,rot:a,vr:(Math.random()-.5)*9,col:cols[i%cols.length],
      rect:false,water:true,life:.65+Math.random()*.55,max:1.2});
  }
  pops.push({x:m.x,y:m.y-24,life:.9});
  spawnIn=1.1+Math.random()*.8;
}

/* ---------- mosquitoes ---------- */
function spawn(){
  const side=Math.random()<.5?-1:1,m={x:side<0?-30:W+30,y:H*(.08+Math.random()*.42),vx:0,vy:0,r:22,ph:Math.random()*9,tx:0,ty:0,tt:0,dir:-side};
  M.push(m);
}
function stepM(m,dt){
  m.ph+=dt*55; m.tt-=dt;
  if(m.tt<=0){m.tx=W*(.06+Math.random()*.88);m.ty=H*(.1+Math.random()*.68);m.tt=1.2+Math.random()*1.8}
  const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy)||1,sp=kills>10?85:62;
  m.vx+=(dx/d*sp-m.vx)*dt*1.6+(Math.random()-.5)*160*dt;
  m.vy+=(dy/d*sp-m.vy)*dt*1.6+(Math.random()-.5)*160*dt;
  m.x+=m.vx*dt; m.y+=m.vy*dt+Math.sin(m.ph*.2)*.5;
  if(Math.abs(m.vx)>8)m.dir=m.vx>0?1:-1;
}
function drawM(m){
  c.save(); c.translate(m.x,m.y); c.scale(m.dir,1);
  const fl=Math.sin(m.ph)*.6;
  c.strokeStyle='#222'; c.lineWidth=1; c.lineCap='round';
  [[-2,2,-14,12],[0,3,-6,16],[3,3,6,15]].forEach(l=>{c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke()});
  c.fillStyle='rgba(190,215,240,.55)'; c.strokeStyle='rgba(110,150,190,.8)';
  for(const s of [1,-1]){c.save();c.translate(-1,-3);c.rotate(-.9+fl*s*.5);c.beginPath();c.ellipse(-7,-3,13,4.5,0,0,6.3);c.fill();c.stroke();c.restore()}
  c.fillStyle='#c1121f'; c.beginPath(); c.ellipse(-9,3,12,4.5,.25,0,6.3); c.fill();   // abdomen
  c.fillStyle='#2b2b2b'; c.beginPath(); c.ellipse(4,0,6,4.5,0,0,6.3); c.fill();      // thorax
  c.beginPath(); c.arc(11,-1,3.6,0,6.3); c.fill();                                   // head
  c.strokeStyle='#111'; c.lineWidth=1.6; c.beginPath(); c.moveTo(14,0); c.lineTo(23,3); c.stroke(); // proboscis
  c.restore();
}

/* ---------- loop ---------- */
function loop(now){
  if(mode!=='play'){ if(mode==='pause')updateBuzz(); return }
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const want=kills>=12?3:kills>=5?2:1;
  if(M.length<want){spawnIn-=dt; if(spawnIn<=0){spawn();spawnIn=1.2}}
  M.forEach(m=>stepM(m,dt));
  // A mosquito reaching the sleeping character ends the game immediately.
  const attacker=M.find(m=>!m.dead&&Math.hypot(m.x-O.x,m.y-O.y)<m.r+27);
  if(attacker){ gameOver(); }
  c.clearRect(0,0,W,H);
  if(aiming){
    let dx=ptr.x-O.x,dy=ptr.y-O.y,l=Math.hypot(dx,dy)||1; dx/=l;dy/=l;
    c.save(); c.strokeStyle='#1a1a1a'; c.lineWidth=2.2; c.setLineDash([9,7]); c.lineCap='butt';
    c.beginPath(); c.moveTo(O.x,O.y); c.lineTo(O.x+dx*2500,O.y+dy*2500); c.stroke(); c.restore();
    c.strokeStyle='#111'; c.fillStyle='#fff'; c.lineWidth=2; c.beginPath(); c.arc(ptr.x,ptr.y,8,0,6.3); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(ptr.x,ptr.y-4); c.lineTo(ptr.x,ptr.y+4); c.stroke();
  }
  for(const b of beams){ b.life-=dt; const a=Math.max(0,b.life/.22);
    c.lineCap='round';
    c.strokeStyle=`rgba(40,130,255,${.4*a})`; c.lineWidth=16; line(b);
    c.strokeStyle=`rgba(0,190,255,${.9*a})`; c.lineWidth=8; line(b);
    c.strokeStyle=`rgba(225,250,255,${a})`; c.lineWidth=2.5; line(b);
    c.fillStyle=`rgba(35,145,255,${.75*a})`; c.beginPath(); c.arc(b.x1,b.y1,13,0,6.3); c.fill();
  }
  beams=beams.filter(b=>b.life>0);
  for(const r of rings){
    r.life-=dt; const k=1-r.life/r.max;
    c.save(); c.globalAlpha=Math.max(0,1-k);
    c.strokeStyle='#45dfff'; c.lineWidth=Math.max(1,r.width*(1-k));
    c.beginPath(); c.arc(r.x,r.y,r.radius+k*48,0,6.3); c.stroke();
    c.restore();
  }
  rings=rings.filter(r=>r.life>0);
  for(const p of parts){ p.life-=dt; p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    c.save(); c.globalAlpha=Math.max(0,p.life/p.max); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.col;
    if(p.water){
      // Oval droplets look like splashing water rather than debris.
      c.beginPath(); c.ellipse(0,0,p.r*.58,p.r*1.25,0,0,6.3); c.fill();
      c.fillStyle='rgba(255,255,255,.7)'; c.beginPath(); c.arc(-p.r*.16,-p.r*.35,Math.max(1,p.r*.16),0,6.3); c.fill();
    } else if(p.rect)c.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    else{c.beginPath();c.arc(0,0,p.r*.7,0,6.3);c.fill()}
    c.restore(); }
  parts=parts.filter(p=>p.life>0);
  M.forEach(drawM);
  for(const p of pops){ p.life-=dt; p.y-=22*dt; c.globalAlpha=Math.max(0,p.life/.9);
    c.fillStyle='#222'; c.font="700 24px 'Comic Sans MS','Comic Neue',cursive"; c.textAlign='center'; c.fillText('+1',p.x,p.y); c.globalAlpha=1; }
  pops=pops.filter(p=>p.life>0);
  updateBuzz();
  if(mode==='play')requestAnimationFrame(loop);
}
function line(b){c.beginPath();c.moveTo(b.x1,b.y1);c.lineTo(b.x2,b.y2);c.stroke()}
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pause() });
resize();
})();
</script>
</body>
